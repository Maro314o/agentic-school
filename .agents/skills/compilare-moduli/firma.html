<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Disegna la firma</title><style>body{font:18px system-ui;max-width:850px;margin:2em auto;padding:0 1em}canvas{border:1px solid #555;touch-action:none;width:100%;height:220px;background:#fff}button{font:inherit;padding:.6em 1em;margin:.5em .5em .5em 0}</style><h1>Disegna la tua firma</h1><p>Usa il mouse, il touchpad o uno schermo tattile. Il disegno rimane sul tuo dispositivo.</p><canvas width="1200" height="320" aria-label="Spazio per disegnare la firma"></canvas><br><button id="clear">Cancella</button><button id="save">Salva firma PNG</button><p>Il file viene salvato nella cartella di download scelta nel browser.</p><script>const c=document.querySelector('canvas'), x=c.getContext('2d');x.strokeStyle='#000';x.lineWidth=3;x.lineCap='round';x.lineJoin='round';let active=false,drawn=false;function pos(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.addEventListener('pointerdown',e=>{active=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))});c.addEventListener('pointermove',e=>{if(active){x.lineTo(...pos(e));x.stroke();drawn=true}});c.addEventListener('pointerup',()=>active=false);c.addEventListener('pointercancel',()=>active=false);document.querySelector('#clear').onclick=()=>{x.clearRect(0,0,c.width,c.height);drawn=false};document.querySelector('#save').onclick=()=>{if(!drawn){alert('Disegna prima la tua firma.');return}const a=document.createElement('a');a.download='firma-autografa.png';a.href=c.toDataURL('image/png');a.click()};</script></html>
